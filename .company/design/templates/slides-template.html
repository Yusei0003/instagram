<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スライド</title>
<!-- 投稿フォルダ（posts/xxxx/）に置いたときの相対パス -->
<link rel="stylesheet" href="../../.company/design/templates/slides.css">
<style>
  /* この投稿だけの調整はここに書く */
</style>
</head>
<body>

<section class="slide cover">
  <span class="page">1/5</span>
  <h1>ここに<em>問いかけ</em>を<br>書きます</h1>
  <p>サブタイトル</p>
</section>

<section class="slide">
  <span class="page">2/5</span>
  <span class="label">ポイント</span>
  <h2>見出し</h2>
  <p>本文。1 枚 60 文字以内が目安です。</p>
</section>

<section class="slide compare">
  <span class="page">3/5</span>
  <h2>比べてみると</h2>
  <div class="compare-grid">
    <div class="card"><h3>A</h3><p>Aの説明</p></div>
    <div class="card right"><h3>B</h3><p>Bの説明</p></div>
  </div>
</section>

<section class="slide table-slide">
  <span class="page">4/5</span>
  <h2>まとめ</h2>
  <table>
    <tr><th>項目</th><th>A</th><th>B</th></tr>
    <tr><td>会社</td><td>…</td><td>…</td></tr>
  </table>
</section>

<section class="slide end">
  <span class="page">5/5</span>
  <h2>保存して<br>見返してね</h2>
  <p>フォローすると次回も届きます</p>
</section>

</body>
</html>
